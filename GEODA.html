<style>

@keyframes rg{0%{width:20px;height:20px;opacity:1}100%{width:900px;height:900px;opacity:0}}
.st{position:absolute;left:50%;top:50%;width:6px;height:6px;animation:st 1.3s steps(9) forwards}@keyframes st{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.rt{position:relative;font-size:16px;color:#ffd84a;text-shadow:3px 3px 0 #0a0418;text-align:center;line-height:1.6;animation:rt 1.4s steps(7) forwards}
@keyframes rt{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
.cds{display:flex;gap:8px;width:100%;max-width:400px;padding:0 8px;box-sizing:border-box;position:relative}

.cd:nth-child(2){animation-delay:.15s}.cd:nth-child(3){animation-delay:.3s}.cd i{font-style:normal;font-size:30px}

@media (prefers-reduced-motion:reduce){button{transition:none}}
</style></head>

<script>

const spike=(px,py,h,w,lean,c1,c2)=>{for(let i=0;i<h;i++){const ww=Math.max(1,Math.round(w*(1-i/h))),xx=Math.round(px-ww/2+i*lean);x.fillStyle=c1;x.fillRect(xx,py-i,ww,1);x.fillStyle=c2;x.fillRect(xx,py-i,Math.max(1,ww>>1),1)}};
// estalactites
for(let i=0;i<14;i++){const px=i*14+RI(0,8),h=RI(10,34),w=RI(6,11);for(let j=0;j<h;j++){const ww=Math.max(1,Math.round(w*(1-j/h)));x.fillStyle=j%5==0?'#1d0e3a':'#10061f';x.fillRect(Math.round(px-ww/2),j,ww,1);x.fillStyle='#2e1856';x.fillRect(Math.round(px-ww/2),j,1,1)}}

for(let i=0;i<9;i++){const l=i<5,px=l?RI(2,34):RI(146,178),c=cl[i%3];spike(px,GROUND+2,RI(14,38),RI(5,8),l?.12:-.12,c[0],c[1])}
// pedestal
x.fillStyle='#0d0720';x.fillRect(CX-33,GROUND-1,66,13);x.fillStyle='#4a3a6e';x.fillRect(CX-31,GROUND-2,62,4);x.fillStyle='#6a58a0';x.fillRect(CX-31,GROUND-2,62,1);x.fillStyle='#2a1c4a';x.fillRect(CX-31,GROUND+2,62,8);
for(let i=0;i<6;i++){x.fillStyle='#3a2860';x.fillRect(CX-28+i*10,GROUND+4+(i%2)*3,5,2)}
const gr=x.createRadialGradient(W/2,H/2,60,W/2,H/2,200);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(5,0,15,.65)');x.fillStyle=gr;x.fillRect(0,0,W,H)})();
const PAL=[['#3a7bd5','#5aa0e8','#86c5f2','#b4e1f7','#e0f4ff'],['#1c1410','#2a1e16','#3a2a1e','#4a3626','#5a4430'],['#14141c','#1e2028','#2a2c38','#383c4c','#464a5c'],null,['#1a0404','#3a0808','#6a1408','#a02a0c','#e0561a']];
const BN=['SUPERFICIE','CAVERNA PEQUENA','MINA ABANDONADA','CAVERNA DE CRISTAL','NUCLEO DA TERRA'],MC=[['#ffffff','#fff2a0'],['#b09070','#806040'],['#d0b080','#a08050'],['#cfe9ff','#8a76c0'],['#ffb040','#ff6020']];
const themeOf=b=>{const s=Math.floor(b/6);return s<3?0:s<6?1:s<9?2:s<13?3:4};
let bgCur=themeOf(save.broken),bgPrev=0,bgT=1;const BGS=[];const getB=i=>BGS[i]||(BGS[i]=i==3?bg:mkBg(i));
function drawBg(){if(bgT<1){const e=bgT*bgT*(3-2*bgT),off=Math.round(e*H);g.drawImage(getB(bgPrev),0,-off);g.drawImage(getB(bgCur),0,H-off)}else g.drawImage(getB(bgCur),0,0)}
function mkBg(t){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5],P=PAL[t];
const im=x.createImageData(W,H),d=im.data;
for(let y=0;y<H;y++)for(let i=0;i<W;i++){const f=Math.min(.999,y/(GROUND+30))*4,k=Math.floor(f),n=parseInt(P[(f-k)>B[(y%4)*4+i%4]/16?k+1:k].slice(1),16),o=(y*W+i)*4;d[o]=n>>16;d[o+1]=n>>8&255;d[o+2]=n&255;d[o+3]=255}
x.putImageData(im,0,0);
const F=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))};
const disc=(cx,cy,r,col,al)=>{x.globalAlpha=al||1;x.fillStyle=col;for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));x.fillRect(Math.round(cx-w),Math.round(cy+j),w*2+1,1)}x.globalAlpha=1};
const drip=(px,len,w,c1,c2)=>{for(let j=0;j<len;j++){const ww=Math.max(1,Math.round(w*(1-j/len)));F(c1,px-ww/2,j,ww,1);F(c2,px-ww/2,j,1,1)}};
const tree=(px,h)=>{F('#5a3a20',px-2,GROUND-9,4,9);for(let k=0;k<3;k++){const by=GROUND-8-k*h*.3,hh=h*.42,bw=h*.5*(1-k*.22);for(let r=0;r<hh;r++){const ww=bw*r/hh+3;F(k%2?'#2f8a4a':'#1f6a3a',px-ww/2,by-hh+r,ww,1)}}};
const FL=[['#5cc84a','#7a5230','#5a3a20','#946a40'],['#6a5238','#3a2a1e','#2a1c12','#4a3626'],['#7a5a38','#2e2e3c','#1e1e2a','#40445a'],0,['#ff8a30','#2a0c0c','#160606','#5a1c10']][t];
for(let y=GROUND;y<H;y++)for(let i=0;i<W;i++){const n=((i*7+y*13)%11)/11;F(y<GROUND+3?FL[0]:n>.8?FL[3]:n<.2?FL[2]:FL[1],i,y,1,1)}

for(let i=0;i<W;i++){const h=34+10*Math.sin(i*.05)+6*Math.sin(i*.13+1);F('#4a9a62',i,GROUND-h,1,h);const h2=18+8*Math.sin(i*.08+2)+5*Math.sin(i*.19);F('#2f7a48',i,GROUND-h2,1,h2)}

for(let i=0;i<W;i++){const ch=14+9*Math.sin(i*.09)+5*Math.sin(i*.23+1);F('#1a110b',i,0,1,ch);F('#4a3626',i,ch,1,1)}
[40,66,118,146].forEach((p,i)=>drip(p,12+i*5%13,7,'#2a1e16','#5a4430'));
F('#6a4a2a',30,112,3,16);disc(31,108,18,'#ff9a30',.12);disc(31,108,10,'#ffb040',.15);F('#ff8a20',29,104,5,6);F('#ffd23c',30,102,3,5);F('#fff2a0',31,104,1,3);
for(let k=0;k<5;k++)disc(RI(30,150),GROUND-2,RI(3,5),'#4a3a2c')}

wd(20,0,9,GROUND);wd(151,0,9,GROUND);wd(14,10,152,9);
for(let k=0;k<22;k++){F('#5a3e22',29+k,19+k,3,3);F('#5a3e22',150-k,19+k,3,3)}
for(const px of[56,124]){F('#888',px,19,1,14);F('#3a2814',px-4,33,9,2);F('#ffcc55',px-3,35,7,8);F('#fff2a0',px-1,37,3,4);F('#3a2814',px-4,43,9,2);disc(px,39,22,'#ffb040',.1);disc(px,39,12,'#ffb040',.12)}

for(let k=0;k<7;k++){let px=RI(0,W),py=k<4?0:RI(20,120);for(let s=0;s<60;s++){px+=RI(-1,1)+(k%2?.4:-.4);py+=1;F(s%7?'#ff7a20':'#ffd23c',px,py,1,2)}}

// ---------- audio ----------
